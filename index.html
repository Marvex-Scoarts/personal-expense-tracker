<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <div class="header-row">
      <h1>💸 Expense Tracker</h1>
      <select id="currency-select" aria-label="Select Currency">
        <option value="₦">🇳🇬 NGN (₦)</option>
        <option value="₵">🇬🇭 GHS (₵)</option>
        <option value="CFA ">🇹🇬 XOF (CFA)</option>
        <option value="$">🇺🇸 USD ($)</option>
        <option value="£">🇬🇧 GBP (£)</option>
      </select>
    </div>


    <!-- 1. Balance Summary Cards -->
    <div class="balance-card">
      <p>Your Balance</p>
      <h2 id="balance">₦0.00</h2>
    </div>

    <div class="inc-exp-container">
      <div class="money-box">
        <h4>Income</h4>
        <p id="money-plus" class="money plus">+₦0.00</p>
      </div>
      <div class="money-box">
        <h4>Expense</h4>
        <p id="money-minus" class="money minus">-₦0.00</p>
      </div>
    </div>

    <!-- 2. Spending Chart Section -->
    <div class="chart-section">
      <h3>📊 Spending Breakdown</h3>
      <canvas id="expense-chart" width="300" height="200"></canvas>
      <p id="chart-empty-msg">Add an expense to see your spending chart!</p>
    </div>

    <!-- 3. Add New Transaction Form -->
    <h3>➕ Add New Transaction</h3>
    <form id="transaction-form">
      <div class="form-control">
        <label for="text">Description</label>
        <input type="text" id="text" placeholder="e.g., Shawarma, Freelance Gig, Data..." required>
      </div>

      <div class="form-control">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount..." step="0.01" required>
      </div>

      <div class="form-row">
        <div class="form-control">
          <label for="type">Type</label>
          <select id="type">
            <option value="expense">Expense (-)</option>
            <option value="income">Income (+)</option>
          </select>
        </div>

        <div class="form-control">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">🍔 Food & Drinks</option>
            <option value="Transport">🚕 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">📱 Data & Bills</option>
            <option value="Fun">🎬 Fun & Hangouts</option>
            <option value="Salary">💰 Salary / Allowance</option>
            <option value="Other">✨ Other</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn">Add Transaction</button>
    </form>

    <!-- 4. Transaction History List -->
    <h3>Transaction History</h3>
    <ul id="list" class="list">
      <!-- Transactions will appear here automatically in Step 3 -->
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
